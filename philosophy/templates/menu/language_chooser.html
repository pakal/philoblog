{% load i18n menu_tags %}

{% if languages|length > 1 %}
{% for language in languages %}
<li class="lang{% if current_language == language.0 %} active{% endif %}">
    <a href="{% page_language_url language.0 %}" title="{% trans "Change to language:" %} {{ language.1 }}" class="lang-flag-link">
        {% if language.0 == 'fr' %}
        <svg class="lang-flag" viewBox="0 0 3 2" width="20" height="14" aria-hidden="true">
            <rect width="1" height="2" x="0" fill="#0055A4"/>
            <rect width="1" height="2" x="1" fill="#FFFFFF"/>
            <rect width="1" height="2" x="2" fill="#EF4135"/>
        </svg>
        {% elif language.0 == 'en' %}
        <svg class="lang-flag" viewBox="0 0 60 30" width="20" height="14" aria-hidden="true">
            <rect width="60" height="30" fill="#00247d"/>
            <path d="M0,0 L60,30 M60,0 L0,30" stroke="#FFFFFF" stroke-width="6"/>
            <path d="M0,0 L60,30 M60,0 L0,30" stroke="#cf142b" stroke-width="2"/>
            <path d="M30,0 V30 M0,15 H60" stroke="#FFFFFF" stroke-width="10"/>
            <path d="M30,0 V30 M0,15 H60" stroke="#cf142b" stroke-width="6"/>
        </svg>
        {% else %}
        {{ language.1 }}
        {% endif %}
    </a>
</li>
{% endfor %}
{% endif %}
