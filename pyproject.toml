[project]
name = "philosophy"
version = "0.1.0"
description = "Regard Humaniste - django-cms website"
requires-python = "==3.10.*"
dependencies = [
    "pytz",
    "logging_tree",
    "html5lib==1.1",  # 0.999999999 used the "collections.Mapping" alias removed in Python 3.10
    "Pillow>=2.7.0",
    "six",
    "decorator==4.4.0",
    "PyYAML==5.1",
    "beautifulsoup4==4.7.1",
    "python-memcached==1.59",
    "setuptools<58",  # runtime "pkg_resources" import by django-polymorphic

    "Django==5.1.15",  # can't switch to 2.2.1 until PyMysql gets updated to match MySQLdb
    "django-compat-patcher==0.14",

    "django-environ==0.4.5",
    "django-cms==5.0.13",
    "djangocms-versioning==2.8.0",  # cms4+ draft/published workflow (replaces cms3 publisher)
    "djangocms-alias==3.2.0",  # cms4+ replacement of static placeholders
    "django-treebeard==4.7.1",
    "easy-thumbnails==2.10.1",
    "django-polymorphic==3.0.0",
    "django-filer==3.6.0",
    "django-compressor==2.4",
    "django-request==1.5.5",
    "django-extensions==2.2.8",

    "djangocms-link==5.2.0",
    "djangocms-snippet==5.0.2",
    "djangocms-picture==4.1.1",  # replaces abandoned cmsplugin-filer (image)
    "djangocms-file==3.0.1",  # replaces abandoned cmsplugin-filer (file)
    "djangocms-admin-style==3.3.1",
    "djangocms-text-ckeditor==5.1.7",
    "cmsplugin-rst",
    "cmsplugin-raw-html",
    "djangocms-page-sitemap==1.4.0",

    "django-terms==1.2.0",
    "django-newsletter==0.9",
    "django-tinymce==2.8.0",

    "django-reversion==3.0.3",
    "django-mptt==0.10.0",
    "django-classy-tags==4.1.0",
    "django-sekizai==4.1.0",

    # Drop-in replacement for MySQLdb, when using its install_as_MySQLdb() patcher
    "PyMySQL==1.2.3",
]

[dependency-groups]
dev = [
    "django-debug-toolbar==6.3.0",
]

[tool.uv]
package = false
# Old packages declaring obsolete upper bounds, that pip used to ignore
override-dependencies = [
    "Django==5.1.15",  # django-terms 1.2.0 declares django<1.10
    "rcssmin==1.1.1",  # django-compressor 2.4 pins 1.0.6, which has no Windows wheel
    "rjsmin==1.2.1",  # django-compressor 2.4 pins 1.1.0, which has no Windows wheel
]
# Some old sdists still use "use_2to3", removed in setuptools 58
build-constraint-dependencies = ["setuptools<58"]

[tool.uv.sources]
cmsplugin-rst = { git = "https://github.com/pakal/cmsplugin-rst" }
cmsplugin-raw-html = { git = "https://github.com/makukha/cmsplugin-raw-html" }
