[project]
name = "philosophy"
version = "0.1.0"
description = "Regard Humaniste - django-cms website"
requires-python = "==3.13.*"
dependencies = [
    "pytz",
    "logging_tree",
    "html5lib==1.1",  # 0.999999999 used the "collections.Mapping" alias removed in Python 3.10
    "Pillow>=2.7.0",
    "six",
    "decorator==5.3.1",
    "PyYAML==6.0.3",
    "beautifulsoup4==4.15.0",
    "python-memcached==1.62",

    "Django==6.1.2",
    "django-compat-patcher==0.14",

    "django-environ==0.14.0",
    "django-cms==5.1.3",
    "djangocms-versioning==2.8.0",  # cms4+ draft/published workflow (replaces cms3 publisher)
    "djangocms-alias==3.2.0",  # cms4+ replacement of static placeholders
    "django-treebeard==4.7.1",
    "easy-thumbnails==2.10.1",
    "django-polymorphic==4.11.7",
    "django-filer==3.6.0",
    "django-compressor==4.6.0",
    "django-extensions==4.1",

    "djangocms-link==5.2.0",
    "djangocms-snippet==5.0.2",
    "djangocms-picture==4.1.1",  # replaces abandoned cmsplugin-filer (image)
    "djangocms-file==3.0.1",  # replaces abandoned cmsplugin-filer (file)
    "djangocms-admin-style==3.3.1",
    "djangocms-text==1.0.2",  # replaces the deprecated djangocms-text-ckeditor
    "cmsplugin-rst==0.3",
    "cmsplugin-raw-html",
    "djangocms-page-sitemap==1.4.0",

    "django-terms==1.2.0",
    "django-newsletter==1.2.1",
    "sorl-thumbnail==13.2.0",  # imported by django-newsletter, which no longer declares it
    "django-tinymce==5.0.0",

    "django-reversion==6.4.0",
    "django-mptt==0.18.0",
    "django-classy-tags==4.1.0",
    "django-sekizai==4.1.0",

    # Drop-in replacement for MySQLdb, when using its install_as_MySQLdb() patcher
    "PyMySQL==1.2.3",
]

[dependency-groups]
dev = [
    "django-debug-toolbar==6.3.0",
]

[tool.uv]
package = false
# Old packages declaring obsolete upper bounds, that pip used to ignore
override-dependencies = [
    "Django==6.1.2",  # django-terms 1.2.0 declares django<1.10
]

[tool.uv.sources]
cmsplugin-raw-html = { git = "https://github.com/makukha/cmsplugin-raw-html" }
