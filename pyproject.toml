[project]
name = "philosophy"
version = "0.1.0"
description = "Regard Humaniste - django-cms website"
requires-python = "==3.7.*"
dependencies = [
    "pytz",
    "logging_tree",
    "html5lib==0.999999999",  # last version with "html5lib.sanitizer" required (or not anymore?) by djangocms_text_ckeditor
    "Pillow>=2.7.0",
    "six",
    "decorator==4.4.0",
    "PyYAML==5.1",
    "beautifulsoup4==4.7.1",
    "python-memcached==1.59",
    "setuptools<58",  # runtime "pkg_resources" import by django-polymorphic

    "Django==2.1.11",  # can't switch to 2.2.1 until PyMysql gets updated to match MySQLdb
    "django-compat-patcher==0.8",

    "django-environ==0.4.5",
    "django-cms==3.7.4",
    "django-treebeard==4.3.1",
    "easy_thumbnails==2.7",
    "django-polymorphic==2.0.3",
    "django-filer==1.5.0",
    "django-compressor==2.4",
    "django-request==1.5.5",
    "django-extensions==2.2.8",
    "django-taggit==1.2.0",
    "django-taggit-autosuggest==0.3.0",

    "djangocms-link==2.4.0",
    "djangocms-snippet==2.3.0",
    "cmsplugin-filer==1.1.3",
    "djangocms-admin-style==1.4.0",
    "djangocms-text-ckeditor==3.7.0",
    "cmsplugin-rst",
    "cmsplugin-raw-html",
    "djangocms-page-tags==0.8.0",
    "djangocms-page-sitemap==0.8.1",

    "django-terms==1.2.0",
    "django-newsletter==0.9",
    "django-tinymce==2.8.0",

    "django-reversion==3.0.3",
    "django-mptt==0.10.0",
    "django-classy-tags==1.0.0",
    "django-sekizai==1.1.0",

    # Drop-in replacement for MySQLdb, when using its install_as_MySQLdb() patcher
    "PyMySQL==0.9.3",
]

[dependency-groups]
dev = [
    "django-debug-toolbar==1.11",
]

[tool.uv]
package = false
# Old packages declaring obsolete upper bounds, that pip used to ignore
override-dependencies = [
    "Django==2.1.11",  # django-terms 1.2.0 declares django<1.10
    "rcssmin==1.1.1",  # django-compressor 2.4 pins 1.0.6, which has no Windows wheel
    "rjsmin==1.2.1",  # django-compressor 2.4 pins 1.1.0, which has no Windows wheel
]
# Some old sdists still use "use_2to3", removed in setuptools 58
build-constraint-dependencies = ["setuptools<58"]

[tool.uv.sources]
cmsplugin-rst = { git = "https://github.com/pakal/cmsplugin-rst" }
cmsplugin-raw-html = { git = "https://github.com/makukha/cmsplugin-raw-html" }
